<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>First day of table practice</title>
        <style>
            table{
                border-collapse: collapse;
            }
        </style>
    </head>
    <body>
        <table border>
            <thead align="center">
                <tr>
                    <th rowspan="2"> </th>
                    <th colspan="2">average</th>
                    <td rowspan="2">Red eyes</td>
                </tr>
                <tr>
                    <td>Height</td>
                    <td>Weight</td>
                </tr>
                <tr>
                    <td>Male</td>
                    <td>1.9</td>
                    <td>0.003</td>
                    <td>40%</td>
                </tr>
                <tr>
                    <td>Female</td>
                    <td>1.7</td>
                    <td>0.002</td>
                    <td>43%</td>
                </tr>
            </thead>
        </table>
    </body>
</html>
